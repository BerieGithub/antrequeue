services:
  postgres:
    image: postgres:16-alpine
    container_name: antrequeue_postgres
    environment:
      POSTGRES_USER: antrequeue
      POSTGRES_PASSWORD: antrequeue
      POSTGRES_DB: antrequeue
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antrequeue"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: antrequeue_redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: antrequeue_rabbitmq
    ports: ["5672:5672", "15672:15672"]   # 15672 = management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

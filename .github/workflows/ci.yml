name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The in-memory store is written from every request goroutine, so a
      # data race there is the most likely bug class in the current code.
      # -race is a no-op until tests exist, but it should be gating from the
      # first test rather than added after one slips through.
      - name: Test
        run: go test ./... -race -cover
